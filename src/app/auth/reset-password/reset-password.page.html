<ion-content>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">YORU<span>♪</span></div>
      <div class="tagline">NUEVA CONTRASEÑA</div>

      @if (step === 'code') {
        <h1>Introduce el código</h1>
        <p class="subtitle">Revisa tu correo <strong>{{ email }}</strong>.</p>

        <label>CÓDIGO DE 6 DÍGITOS</label>
        <input class="code-input" type="text" maxlength="6" inputmode="numeric"
               [(ngModel)]="code" (keyup.enter)="verify()">

        @if (error) { <div class="error">{{ error }}</div> }

        <button class="btn-primary" [disabled]="loading" (click)="verify()">
          {{ loading ? 'Verificando…' : 'Verificar código' }}
        </button>
        <button class="btn-link" routerLink="/forgot-password">Reenviar código</button>
      } @else {
        <h1>Nueva contraseña</h1>
        @if (info) { <div class="success">{{ info }}</div> }

        <label>NUEVA CONTRASEÑA</label>
        <input type="password" [(ngModel)]="newPassword">

        <label>CONFIRMAR</label>
        <input type="password" [(ngModel)]="confirm">

        @if (error) { <div class="error">{{ error }}</div> }

        <button class="btn-primary" [disabled]="loading" (click)="reset()">
          {{ loading ? 'Guardando…' : 'Cambiar contraseña' }}
        </button>
      }
    </div>
  </div>
</ion-content>
