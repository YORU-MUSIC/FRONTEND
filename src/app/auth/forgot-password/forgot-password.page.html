<ion-content>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">YORU<span>♪</span></div>
      <div class="tagline">RECUPERAR ACCESO</div>

      <h1>¿Olvidaste tu contraseña?</h1>
      <p class="subtitle">Te enviaremos un código a tu correo.</p>

      <label>EMAIL</label>
      <input type="email" [(ngModel)]="email" autocomplete="email">

      @if (error) { <div class="error">{{ error }}</div> }

      <button class="btn-primary" [disabled]="loading" (click)="submit()">
        {{ loading ? 'Enviando…' : 'Enviar código' }}
      </button>

      <button class="btn-link" routerLink="/login">Volver al login</button>
    </div>
  </div>
</ion-content>
